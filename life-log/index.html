<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Best Days</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080707}
body{font-family:'DM Sans',sans-serif;color:#EDE8DF}
#app{width:100%;height:100vh;position:relative;overflow:hidden;display:flex;justify-content:center}
#view{width:100%;max-width:430px;height:100vh;position:relative;overflow:hidden}

/* ── SHARED ── */
.scroll{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
::placeholder{color:#282420}
input[type=“date”]::-webkit-calendar-picker-indicator{filter:invert(.35)}
.btn{border:none;cursor:pointer;font-family:‘DM Sans’,sans-serif;transition:opacity .15s}
.btn:active{opacity:.7}
.gold{background:#C8A87A;color:#0C0B0A;font-size:14px;font-weight:600;padding:13px 24px;border-radius:100px}
.ghost{background:rgba(0,0,0,.5);border:1px solid rgba(237,232,223,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#EDE8DF;font-size:13px;padding:12px 20px;border-radius:100px}
.bare{background:none;color:#5A5550;font-size:13px;padding:4px 0}
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#484440}
.fin,.fta{background:transparent;border:none;border-bottom:1px solid #1A1816;color:#EDE8DF;font-size:15px;padding:10px 0;width:100%;outline:none;font-family:‘DM Sans’,sans-serif;font-weight:300}
.fta{resize:none;height:82px}
.row2{display:flex;gap:16px}.row2 .field{flex:1}
.ubox{width:100%;background:#0F0D0B;border:1px dashed #1E1B18;border-radius:14px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#2A2623;position:relative}
.ubox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uico{font-size:24px;position:relative;z-index:1}
.utxt{font-size:12px;letter-spacing:.5px;position:relative;z-index:1}
.ubox-tall{aspect-ratio:4/5}
.inner{padding:62px 26px 60px;display:flex;flex-direction:column;gap:24px}
.form-head{font-family:‘Lora’,serif;font-size:22px;font-style:italic}
.form-sub{font-size:13px;color:#4A4540;font-weight:300;margin-top:4px}
.form-acts{display:flex;gap:10px;padding-top:4px}
.form-acts .ghost{flex:1}.form-acts .gold{flex:2}
.fade{animation:fi .22s ease}
.up{animation:su .25s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── KEY ── */
.key-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;height:100vh;padding:52px;text-align:center}
.key-title{font-family:‘Lora’,serif;font-size:34px;font-style:italic;line-height:1.3}
.key-sub{font-size:13px;color:#484440;line-height:1.7;font-weight:300;margin-top:-18px}
.key-in{background:transparent;border:none;border-bottom:1px solid #1A1816;color:#EDE8DF;font-size:40px;padding:10px 0;width:100%;outline:none;font-family:‘DM Sans’,sans-serif;font-weight:300;text-align:center;letter-spacing:14px}
.key-err{font-size:12px;color:#C87A7A;min-height:16px;text-align:center}

/* ── CONSTELLATION ── */
.constellation{position:absolute;inset:0;overflow:hidden;background:#080707}
canvas#stars{position:absolute;inset:0;pointer-events:none}
.dot-wrap{position:absolute;inset:0;overflow:hidden}
.dot{position:absolute;cursor:pointer;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.dot:active{transform:translate(-50%,-50%) scale(.85)}
.dot-inner{border-radius:50%;transition:box-shadow .3s,transform .3s}
.dot.day .dot-inner{width:10px;height:10px;background:#C8A87A;box-shadow:0 0 8px 2px rgba(200,168,122,.5)}
.dot.trip .dot-inner{width:13px;height:13px;background:#A8C8C0;box-shadow:0 0 10px 3px rgba(168,200,192,.5)}
.dot.moment .dot-inner{width:9px;height:9px;background:#C8A8C0;box-shadow:0 0 8px 2px rgba(200,168,192,.5)}
.dot.memory .dot-inner{width:8px;height:8px;background:#A0A8C8;box-shadow:0 0 6px 2px rgba(160,168,200,.45)}
.dot:hover .dot-inner{transform:scale(1.7);box-shadow:0 0 18px 6px rgba(255,255,255,.25)}
.dot-photo{position:absolute;width:52px;height:52px;border-radius:50%;object-fit:cover;opacity:0;transition:opacity .3s;pointer-events:none;border:1.5px solid rgba(255,255,255,.12)}
.dot:hover .dot-photo{opacity:1}
.dot-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(237,232,223,.4);white-space:nowrap;pointer-events:none;letter-spacing:.5px;opacity:0;transition:opacity .3s}
.dot:hover .dot-label{opacity:1}
.const-hdr{position:absolute;top:0;left:0;right:0;padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;z-index:10;pointer-events:none}
.const-title{font-family:‘Lora’,serif;font-size:18px;font-style:italic;color:rgba(237,232,223,.5)}
.const-count{font-size:11px;color:rgba(237,232,223,.3);letter-spacing:1px}
.const-btns{position:absolute;bottom:28px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:10}
.const-add{width:52px;height:52px;border-radius:50%;background:#C8A87A;border:none;cursor:pointer;font-size:22px;color:#0C0B0A;box-shadow:0 4px 20px rgba(200,168,122,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.const-add:active{transform:scale(.88)}
.const-lock{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.const-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;pointer-events:none}
.const-empty-icon{font-size:32px;opacity:.15}
.const-empty-txt{font-size:14px;color:#3A3530;line-height:1.7}

/* ── MEMORY PAGE ── */
.mem-page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#080707}
.mem-page::-webkit-scrollbar{display:none}
.mem-hero{width:100%;aspect-ratio:4/5;position:relative;overflow:hidden;background:#111009;flex-shrink:0}
.mem-hero img{width:100%;height:100%;object-fit:cover;display:block}
.mem-hero-grad{position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(to top,#080707 0%,transparent 100%);pointer-events:none}
.mem-hero-overlay{position:absolute;bottom:0;left:0;right:0;padding:28px 24px 24px}
.mem-back{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;cursor:pointer;color:rgba(237,232,223,.7);font-size:16px;display:flex;align-items:center;justify-content:center;z-index:10}
.mem-badge{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(237,232,223,.4);margin-bottom:8px}
.mem-title{font-family:‘Lora’,serif;font-size:32px;font-weight:600;line-height:1.2;color:#F5F0E8;margin-bottom:6px}
.mem-date{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C8A87A}
.mem-body{padding:28px 24px 80px;display:flex;flex-direction:column;gap:32px}
.mem-caption{font-size:16px;line-height:1.75;color:rgba(237,232,223,.75);font-weight:300}
.mem-text-full{font-size:16px;line-height:1.85;color:rgba(237,232,223,.8);font-weight:300;white-space:pre-wrap}
.mem-section-lbl{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#484440;margin-bottom:14px}
.mem-photos{display:grid;gap:8px}
.mem-photos-1{grid-template-columns:1fr}
.mem-photos-2{grid-template-columns:1fr 1fr}
.mem-photos-3{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
.mem-photo{border-radius:12px;overflow:hidden;background:#111009}
.mem-photo img{width:100%;display:block;object-fit:cover}
.mem-photo-tall{aspect-ratio:3/4}
.mem-photo-sq{aspect-ratio:1}
.mem-photo-wide{aspect-ratio:16/9}
.mem-photos-3 .mem-photo:first-child{grid-column:1/-1;aspect-ratio:16/9}
.mem-photos-1 .mem-photo{aspect-ratio:4/5}
.mem-no-photo{width:100%;aspect-ratio:4/5;background:#0F0D0B;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1E1B18;font-size:40px}

/* TRIP STOPS */
.stop-item{display:flex;flex-direction:column;gap:12px;padding:20px;background:#0F0D0B;border-radius:16px;border:1px solid #1A1816}
.stop-num-lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:#484440}
.stop-name-txt{font-family:‘Lora’,serif;font-size:20px;font-weight:600;color:#EDE8DF;line-height:1.2}
.stop-notes-txt{font-size:14px;line-height:1.65;color:rgba(237,232,223,.65);font-weight:300}
.stop-photo-view{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#111009}
.stop-photo-view img{width:100%;height:100%;object-fit:cover;display:block}

/* MOMENT collage on mem page */
.moment-collage{display:grid;gap:6px;border-radius:14px;overflow:hidden}
.mc-1{grid-template-columns:1fr}
.mc-2{grid-template-columns:1fr 1fr}
.mc-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mc-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mc-cell{overflow:hidden;background:#111009;aspect-ratio:1}
.mc-3 .mc-cell:first-child{grid-row:1/3;aspect-ratio:auto}
.mc-cell img{width:100%;height:100%;object-fit:cover;display:block}

.mem-del{background:none;border:1px solid rgba(200,120,120,.25);color:rgba(200,120,120,.6);font-size:12px;padding:10px 20px;border-radius:100px;cursor:pointer;font-family:‘DM Sans’,sans-serif;align-self:flex-start}
.mem-del:hover{border-color:rgba(200,120,120,.5);color:rgba(200,120,120,.9)}

/* ── TEMPLATE ── */
.tmpl-wrap{display:flex;flex-direction:column;justify-content:center;gap:22px;height:100vh;padding:48px 26px}
.tmpl-head{font-family:‘Lora’,serif;font-size:24px;font-style:italic}
.tmpl-list{display:flex;flex-direction:column;gap:10px}
.tmpl-card{padding:18px 20px;border-radius:16px;border:1px solid #181512;cursor:pointer;display:flex;align-items:center;gap:16px;background:#0D0B09;transition:border-color .2s}
.tmpl-card:hover,.tmpl-card:active{border-color:#C8A87A}
.tmpl-icon{font-size:24px;width:32px;text-align:center}
.tmpl-name{font-size:15px;font-weight:500;margin-bottom:2px}
.tmpl-desc{font-size:12px;color:#4A4540;font-weight:300;line-height:1.35}

/* ── STOPS ADD FORM ── */
.stops-list{display:flex;flex-direction:column;gap:14px}
.stop-card{background:#0D0B09;border:1px solid #181512;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.stop-hdr{display:flex;align-items:center;justify-content:space-between}
.stop-num{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#484440}
.sphoto{width:80px;height:80px;border-radius:10px;background:#0C0A08;border:1px dashed #1A1816;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#2A2623;font-size:20px;position:relative;flex-shrink:0}
.sphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* MOMENT PHOTOS FORM */
.mphoto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mphoto-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#0F0D0B;position:relative}
.mphoto-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mphoto-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;z-index:2;border:none;font-family:‘DM Sans’,sans-serif;line-height:1}
.mphoto-add{aspect-ratio:1;border-radius:10px;border:1px dashed #1E1B18;background:#0F0D0B;display:flex;align-items:center;justify-content:center;color:#2A2623;cursor:pointer;font-size:22px}
</style>

</head>
