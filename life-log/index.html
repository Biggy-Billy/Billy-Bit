<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:'DM Sans',sans-serif;color:#EDE8DF}

#app{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center
}

  width:100%;
  max-width:430px;
  height:100vh;
  position:relative;
  overflow:hidden
}

/* SHARED */

.scroll{
  height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none
}

.scroll::-webkit-scrollbar{display:none}

::placeholder{color:#282420}

  filter:invert(.35)
}

.btn{
  border:none;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:opacity .15s
}

.btn:active{opacity:.7}

.gold{
  background:#C8A87A;
  color:#0C0B0A;

  padding:13px 24px;
  border-radius:100px
}

.ghost{
  background:rgba(0,0,0,.5);
  border:1px solid rgba(237,232,223,.16);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#EDE8DF;
  font-size:13px;
  padding:12px 20px;
  border-radius:100px
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px
}

.lbl{
  font-size:10px;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:#484440
}

.fin,.fta{
  background:transparent;
  border:none;
  border-bottom:1px solid #1A1816;
  color:#EDE8DF;
  font-size:15px;
  padding:10px 0;
  width:100%;
  outline:none;
  font-family:'DM Sans',sans-serif;
  font-weight:300
}

  resize:none;
  height:82px
}
</style>
</head>

<body>

<div id="app">
  <div id="view"></div>
</div>

<script>

// INDEXEDDB

const DB = {
  db:null,

  init(){
    return new Promise((ok,fail)=>{
      const r=indexedDB.open('bd-v3',1);

      r.onupgradeneeded=e=>{
        const d=e.target.result;

        if(!d.objectStoreNames.contains('entries')){
          d.createObjectStore('entries',{keyPath:'id'});
        }

        if(!d.objectStoreNames.contains('meta')){
          d.createObjectStore('meta',{keyPath:'k'});
        }
      };

      r.onsuccess=e=>{
        this.db=e.target.result;
        ok();
      };

      r.onerror=()=>fail(r.error);
    });
  },

  tx(s,m){
    return this.db.transaction(s,m).objectStore(s);
  },

  getAll(){
    return new Promise((ok,f)=>{
      const r=this.tx('entries','readonly').getAll();

      r.onsuccess=()=>ok(r.result||[]);
      r.onerror=()=>f(r.error);
    });
  },

  put(e){
    return new Promise((ok,f)=>{
      const t=this.db.transaction('entries','readwrite');

      t.objectStore('entries').put(e);

      t.oncomplete=ok;
      t.onerror=()=>f(t.error);
    });
  }
};

// COMPRESS

function compress(file,maxW=1200,q=0.82){
  return new Promise(ok=>{

    const rd=new FileReader();

    rd.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        const ratio=Math.min(
          maxW/img.width,
          maxW/img.height,
          1
        );

        const c=document.createElement('canvas');

        c.width=img.width*ratio;
        c.height=img.height*ratio;

        c.getContext('2d').drawImage(
          img,
          0,
          0,
          c.width,
          c.height
        );

        ok(c.toDataURL('image/jpeg',q));
      };

      img.src=e.target.result;
    };

    rd.readAsDataURL(file);
  });
}

// STATE

const S={
  view:'loading',
  entries:[],
  form:null,
  openEntry:null
};

const blank=(t='day')=>({
  type:t,
  photo:null,
  photos:[],
  title:'',
  caption:'',
  date:'',
  startDate:'',
  endDate:'',
  description:'',
  text:'',
  stops:[]
});

// UTILS

const $ = id => document.getElementById(id);

const V = () => document.getElementById('view');

const esc = s => (s || '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');

const fmt = d =>
  d
    ? new Date(d+'T12:00:00').toLocaleDateString(
        'en-AU',
        {
          day:'numeric',
          month:'long',
          year:'numeric'
        }
      )
    : '';

const go = v=>{
  S.view=v;
  render();
};

// RENDER

function render(){

  const el=V();

  el.innerHTML='';

  ({
    loading:rLoad,
    key:rKey
  }[S.view]||rLoad)(el);
}

function rLoad(el){
  el.innerHTML=
  '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:13px;color:#383430">loading...</div>';
}

// KEY

function rKey(el){

  el.innerHTML=`
  <div class="key-wrap fade">

    <div class="key-title">
      the best days<br>
      of your life
    </div>

    <div class="key-sub">
      enter your key to continue
    </div>

    <div style="width:100%">

      <input
        id="kf"
        class="key-in"
        type="password"
        placeholder="...."
        autocomplete="off"
        spellcheck="false"
      >

      <div
        id="ke"
        class="key-err"
        style="margin-top:10px"
      ></div>

    </div>

    <button
      class="btn gold"
      id="kb"
      style="width:100%;padding:15px 0"
    >
      enter
    </button>

  </div>
  `;

  $('kf').focus();

  $('kf').onkeydown=e=>{
    if(e.key==='Enter'){
      submitKey($('kf').value);
    }
  };

  $('kb').onclick=()=>{
    submitKey($('kf').value);
  };
}

async function submitKey(raw){

  raw=(raw||'').trim();

  if(!raw)return;

  go('loading');

  S.entries=(await DB.getAll()).sort(
    (a,b)=>
      (b.date||'').localeCompare(a.date||'')
  );

  console.log('unlocked');

  // temporary
}

// INIT

(async()=>{

  try{
    render();
    await DB.init();
    go('key');
  }

  catch(err){

    document.getElementById('view').innerHTML=`
    <div style="
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100vh;
      gap:16px;
      padding:40px;
      text-align:center
    ">

      <div style="font-size:13px;color:#C87A7A">
        something went wrong loading the app
      </div>

      <div style="
        font-size:11px;
        color:#484440;
        word-break:break-all
      ">
        ${err?.message || 'unknown error'}
      </div>

      <button
        onclick="location.reload()"
        style="
          margin-top:8px;
          background:#C8A87A;
          color:#0C0B0A;
          border:none;
          padding:12px 24px;
          border-radius:100px;
          cursor:pointer;
          font-family:'DM Sans',sans-serif;
          font-size:13px;
          font-weight:600
        "
      >
        retry
      </button>

    </div>
    `;
  }

})();

</script>
</body>
</html>
